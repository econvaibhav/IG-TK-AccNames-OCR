[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ig-tk-accnames-ocr"
version = "0.5.0"
description = "Reviewable account-label extraction from Instagram Reels and TikTok clips"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ocr", "instagram", "tiktok", "video", "account-names", "human-review"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "opencv-python-headless>=4.8,<5",
    "numpy>=1.24,<3",
    "openpyxl>=3.1,<4",
    "Pillow>=10",
]

[project.urls]
Source = "https://github.com/econvaibhav/IG-TK-AccNames-OCR"
Documentation = "https://github.com/econvaibhav/IG-TK-AccNames-OCR#readme"
Issues = "https://github.com/econvaibhav/IG-TK-AccNames-OCR/issues"
Releases = "https://github.com/econvaibhav/IG-TK-AccNames-OCR/releases"

[project.optional-dependencies]
easyocr = ["easyocr>=1.7.2,<2"]
paddle = ["paddleocr>=3.7,<3.8", "paddlepaddle>=3.2,<4"]
# Excel is included in the base package; keep older .[excel] commands working.
excel = []

[project.scripts]
ig-tk-accnames-ocr = "ig_tk_ocr.__main__:main"
# Retain the original command for existing scripts.
instagram-ocr = "ig_tk_ocr.__main__:main"

[tool.setuptools.packages.find]
include = ["ig_tk_ocr*"]

[tool.setuptools.package-data]
ig_tk_ocr = ["static/*.js", "static/*.css"]
